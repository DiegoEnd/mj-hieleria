<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>MJ Hielería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eef5fa; --card:#ffffff; --ink:#0f2433; --muted:#5d7385; --line:#dbe7ef;
  --brand:#0b3d5c; --brand2:#1688c9; --ice:#d9f0fb; --ok:#13875b; --okbg:#e2f5ec;
  --warn:#b26a00; --warnbg:#fff2dc; --bad:#c2312f; --badbg:#fde6e5; --shadow:0 1px 2px rgba(15,36,51,.06),0 4px 14px rgba(15,36,51,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0b3d5c,#12608f);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
header .logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:20px}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
header small{display:block;opacity:.75;font-size:12px;font-weight:500}
header .sp{flex:1}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom));max-width:820px;margin:0 auto}
/* nav */
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bottom button span{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--brand2);background:var(--ice)}
/* cards */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)!important}}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)} .kpi.brand{background:linear-gradient(135deg,#1688c9,#0b3d5c);color:#fff} .kpi.brand .l,.kpi.brand .s{color:rgba(255,255,255,.8)}
.seg{display:flex;background:#e1ebf2;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:12px;background:var(--ice);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ice);color:var(--brand)}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.warn{background:var(--warnbg);color:var(--warn)} .badge.bad{background:var(--badbg);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.block{width:100%} .btn.ghost{background:var(--ice);color:var(--brand)} .btn.wa{background:#1fa855} .btn.danger{background:var(--badbg);color:var(--bad)} .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:18px;border:0;background:var(--brand2);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(22,136,201,.45);cursor:pointer}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfe;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(22,136,201,.15)}
.search{margin-bottom:10px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.bar{height:8px;background:#e5eef4;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.alert.warn{background:var(--warnbg);color:#7a4900} .alert.bad{background:var(--badbg);color:#8f1f1d} .alert.info{background:var(--ice);color:var(--brand)}
.alert b{font-weight:800}
/* stepper */
.prod{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.prod .ic{width:42px;height:42px;border-radius:12px;background:var(--ice);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.prod .grow b{white-space:nowrap}
.prod .sub{display:flex;align-items:center;gap:4px;white-space:nowrap}
.prod .sub input{width:62px!important}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:11px;border:0;background:var(--ice);color:var(--brand);font-size:20px;font-weight:800;cursor:pointer}
.step input{width:64px;text-align:center;padding:8px;font-weight:800}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--brand);color:#fff;border-radius:14px;padding:14px 16px;margin:12px 0}
.total b{font-size:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button.on{background:var(--brand2);border-color:var(--brand2);color:#fff}
.sugg{border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:240px;overflow:auto;background:var(--card)}
.sugg div{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:0}
.picked{display:flex;align-items:center;gap:10px;background:var(--ice);border-radius:12px;padding:10px 12px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,25,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 6px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#0f2433;color:#fff;padding:11px 16px;border-radius:12px;z-index:99;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.chartbox{position:relative;height:220px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0b3d5c,#1688c9 70%,#8fd3f4)}
#login .box{background:var(--card);border-radius:22px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#login .big{font-size:44px;text-align:center}
#login h2{text-align:center;margin:6px 0 2px}
#login p{text-align:center;color:var(--muted);margin:0 0 14px;font-size:14px}
.link{background:none;border:0;color:var(--brand2);font-weight:600;cursor:pointer;padding:10px;width:100%}
.muted{color:var(--muted)} .r{text-align:right}
.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sectiontitle h2{font-size:16px;margin:0}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login" class="hidden">
  <div class="box">
    <div class="big">🧊</div>
    <h2>MJ Hielería</h2>
    <p id="loginMsg">Portal interno · Ingresa con tu cuenta</p>
    <form id="loginForm">
      <label>Correo</label><input name="email" type="email" required autocomplete="username">
      <label>Contraseña</label><input name="password" type="password" required minlength="6" autocomplete="current-password">
      <div style="height:14px"></div>
      <button class="btn block" id="loginBtn">Ingresar</button>
    </form>
    <button class="link" id="toggleSignup">¿Primera vez? Crear cuenta</button>
    <div id="loginErr" class="sub" style="color:var(--bad);text-align:center"></div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header>
    <div class="logo">🧊</div>
    <div><h1 id="hdrName">MJ HIELERIA SAC</h1><small id="hdrSub">Portal interno</small></div>
    <div class="sp"></div>
    <button class="iconbtn" id="btnRefresh" title="Actualizar">⟳</button>
    <button class="iconbtn" id="btnConfig" title="Configuración">⚙</button>
  </header>
  <main id="view"></main>
  <nav class="bottom" id="nav">
    <button data-v="inicio" class="on"><span>🏠</span>Inicio</button>
    <button data-v="vender"><span>🧊</span>Vender</button>
    <button data-v="clientes"><span>👥</span>Clientes</button>
    <button data-v="finanzas"><span>💰</span>Finanzas</button>
    <button data-v="stock"><span>📦</span>Stock</button>
  </nav>
</div>

<script>
/* ================= CONFIG ================= */
const SUPA_URL = 'https://arjasunqlksfimfpgqwk.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyamFzdW5xbGtzZmltZnBncXdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MjAzOTMsImV4cCI6MjEwOTM5NjM5M30.kIAA9F2IZ-fE0x6QiqZ28MpXNKVjP7U_MXnqR6i9KWU';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

const CAT_GASTO = ['Luz','Agua','Alquiler','Bolsas / insumos','Combustible / delivery','Sueldos','Mantenimiento','Equipos','Préstamos','Impuestos','Otros'];
const DISTRITOS = ['Ate','Barranco','Breña','Carabayllo','Chorrillos','Comas','El Agustino','Independencia','Jesús María','La Molina','La Victoria','Lima','Lince','Los Olivos','Lurigancho','Lurín','Magdalena','Miraflores','Pachacámac','Pueblo Libre','Puente Piedra','Rímac','San Borja','San Isidro','San Juan de Lurigancho','San Juan de Miraflores','San Luis','San Martín de Porres','San Miguel','Santa Anita','Santiago de Surco','Surquillo','Villa El Salvador','Villa María del Triunfo','Callao','Otro'];
const TIPOS_CLI = ['Bodega','Restaurante','Juguería','Pollería','Cevichería','Discoteca / bar','Eventos','Mercado','Persona natural','Otro'];

/* ================= STATE & UTILS ================= */
const S = { empresa:null, clientes:[], ventas:[], gastos:[], cuentas:[], prestamos:[], movs:[], admins:[], view:'inicio', periodo:'semana', finTab:'resumen', cliFiltro:'todos', mes:null };
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v || 0);
const money = n => 'S/ ' + num(n).toLocaleString('es-PE', {minimumFractionDigits:2, maximumFractionDigits:2});
const int = n => num(n).toLocaleString('es-PE');
const hoy = () => new Date().toLocaleDateString('en-CA', {timeZone:'America/Lima'});
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const diffDays = (a, b) => Math.round((new Date(b+'T12:00:00Z') - new Date(a+'T12:00:00Z')) / 864e5);
const fmtFecha = iso => iso ? new Date(iso+'T12:00:00Z').toLocaleDateString('es-PE',{day:'2-digit',month:'short',timeZone:'UTC'}) : '—';
const fmtFechaL = iso => iso ? new Date(iso+'T12:00:00Z').toLocaleDateString('es-PE',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}) : '—';
const mesDe = iso => iso.slice(0,7);
const nombreMes = ym => new Date(ym+'-15T12:00:00Z').toLocaleDateString('es-PE',{month:'long',year:'numeric',timeZone:'UTC'});
const iniciales = s => (s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const diaSemana = iso => new Date(iso+'T12:00:00Z').getUTCDay();
const lunesDe = iso => { const d = diaSemana(iso); return addDays(iso, d===0 ? -6 : 1-d); };
const telWa = t => { let d = String(t||'').replace(/\D/g,''); if (d.length===9) d = '51'+d; return d; };
const cliById = id => S.clientes.find(c => c.id === id);
const deuda = v => Math.max(num(v.total) - num(v.monto_pagado), 0);
let charts = [];

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function chk(error){ if(error){ console.error(error); toast('Error: '+error.message); throw error; } }

async function fetchAll(build){
  let out=[], from=0; const size=1000;
  for(;;){ const {data,error}=await build().range(from,from+size-1); chk(error); out=out.concat(data); if(data.length<size) break; from+=size; }
  return out;
}

async function loadAll(){
  const [emp, cli, ven, gas, cue, pre, mov, adm] = await Promise.all([
    sb.from('hielo_empresa').select('*').eq('id',1).single(),
    fetchAll(()=>sb.from('hielo_clientes_resumen').select('*').order('nombre')),
    fetchAll(()=>sb.from('hielo_ventas').select('*').order('fecha',{ascending:false}).order('id',{ascending:false})),
    fetchAll(()=>sb.from('hielo_gastos').select('*').order('fecha',{ascending:false})),
    fetchAll(()=>sb.from('hielo_cuentas_pagar').select('*').order('vencimiento')),
    fetchAll(()=>sb.from('hielo_prestamos').select('*').order('fecha',{ascending:false})),
    fetchAll(()=>sb.from('hielo_movimientos_stock').select('*').order('fecha',{ascending:false}).order('id',{ascending:false})),
    sb.from('hielo_admins').select('*').order('created_at')
  ]);
  chk(emp.error); chk(adm.error);
  Object.assign(S, {empresa:emp.data, clientes:cli, ventas:ven, gastos:gas, cuentas:cue, prestamos:pre, movs:mov, admins:adm.data});
  $('#hdrName').textContent = S.empresa.nombre;
}

function stockActual(){
  let s15=0, s3=0;
  for(const m of S.movs){ const sg = m.tipo==='Merma' ? -1 : 1; s15 += sg*m.cant_15; s3 += sg*m.cant_3; }
  for(const v of S.ventas){ s15 -= v.cant_15; s3 -= v.cant_3; }
  return {s15, s3};
}
function rango(periodo){
  const h = hoy();
  if(periodo==='hoy') return [h,h];
  if(periodo==='semana') return [lunesDe(h),h];
  if(periodo==='mes') return [h.slice(0,8)+'01',h];
  if(periodo==='anio') return [h.slice(0,5)+'01-01',h];
}
const enRango = (f,[a,b]) => f>=a && f<=b;
function porRecordar(){
  const h = hoy();
  return S.clientes.filter(c => c.activo && c.ultima_compra && c.dias_sin_comprar >= c.frecuencia_dias && c.telefono && (!c.ultimo_recordatorio || c.ultimo_recordatorio < c.ultima_compra || diffDays(c.ultimo_recordatorio,h) >= 3))
    .sort((a,b)=>b.dias_sin_comprar-a.dias_sin_comprar);
}

/* ================= SHEET ================= */
function sheet(title, html, mount){
  const bg = document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div><h2>${title}</h2>${html}</div>`;
  bg.addEventListener('click', e => { if(e.target===bg) bg.remove(); });
  document.body.appendChild(bg);
  const close = () => bg.remove();
  mount && mount($('.sheet',bg), close);
  return close;
}
function confirmar(msg){ return window.confirm(msg); }

/* ================= ROUTER ================= */
function go(v){ S.view=v; $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); render(); window.scrollTo(0,0); }
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  $$('.fab').forEach(f=>f.remove());
  const V = {inicio:vInicio, vender:vVender, clientes:vClientes, finanzas:vFinanzas, stock:vStock, config:vConfig}[S.view];
  V($('#view'));
}

/* ================= INICIO ================= */
function vInicio(el){
  const r = rango(S.periodo), h = hoy();
  const ven = S.ventas.filter(v=>enRango(v.fecha,r));
  const gas = S.gastos.filter(g=>enRango(g.fecha,r) && g.tipo!=='Préstamo');
  const tot = ven.reduce((a,v)=>a+num(v.total),0);
  const b15 = ven.reduce((a,v)=>a+v.cant_15,0), b3 = ven.reduce((a,v)=>a+v.cant_3,0);
  const tg = gas.reduce((a,g)=>a+num(g.monto),0);
  const util = tot - tg;
  const st = stockActual();
  const porCobrar = S.ventas.reduce((a,v)=>a+deuda(v),0);
  const prox = S.cuentas.filter(c=>!c.pagado && c.vencimiento <= addDays(h,7));
  const vencidas = prox.filter(c=>c.vencimiento < h);
  const rec = porRecordar();
  const lbl = {hoy:'hoy',semana:'esta semana',mes:'este mes',anio:'este año'}[S.periodo];

  // top clientes y distritos
  const byCli = {}, byDis = {}, byDia = [0,0,0,0,0,0,0];
  for(const v of ven){
    if(v.cliente_id){ byCli[v.cliente_id] = byCli[v.cliente_id] || {t:0,b:0}; byCli[v.cliente_id].t += num(v.total); byCli[v.cliente_id].b += v.cant_15+v.cant_3; }
    const d = v.distrito || cliById(v.cliente_id)?.distrito || 'Sin distrito';
    byDis[d] = (byDis[d]||0) + num(v.total);
  }
  // día de la semana: últimos 60 días para tener tendencia
  for(const v of S.ventas.filter(v=>v.fecha>=addDays(h,-60))) byDia[diaSemana(v.fecha)] += v.cant_15+v.cant_3;
  const topCli = Object.entries(byCli).sort((a,b)=>b[1].t-a[1].t).slice(0,5);
  const topDis = Object.entries(byDis).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxDis = topDis[0]?.[1] || 1, maxCli = topCli[0]?.[1].t || 1;
  const mejorDia = byDia.indexOf(Math.max(...byDia));

  el.innerHTML = `
    <div class="seg">${['hoy','semana','mes','anio'].map(p=>`<button data-p="${p}" class="${S.periodo===p?'on':''}">${{hoy:'Hoy',semana:'Semana',mes:'Mes',anio:'Año'}[p]}</button>`).join('')}</div>
    ${vencidas.length?`<div class="alert bad" data-go="pagar">⚠️ <div><b>${vencidas.length} pago(s) vencido(s)</b> · ${money(vencidas.reduce((a,c)=>a+num(c.monto),0))}</div></div>`:''}
    ${prox.length-vencidas.length>0?`<div class="alert warn" data-go="pagar">🗓️ <div><b>${prox.length-vencidas.length} pago(s)</b> vencen en los próximos 7 días · ${money(prox.filter(c=>c.vencimiento>=h).reduce((a,c)=>a+num(c.monto),0))}</div></div>`:''}
    ${rec.length?`<div class="alert info" data-go="recordar">💬 <div><b>${rec.length} cliente(s)</b> para recordar hoy por WhatsApp</div></div>`:''}
    ${(st.s15<S.empresa.stock_minimo_15||st.s3<S.empresa.stock_minimo_3)?`<div class="alert warn" data-go="stock">📦 <div><b>Stock bajo</b> · 1.5kg: ${int(st.s15)} · 3kg: ${int(st.s3)}</div></div>`:''}
    <div class="grid2 grid4">
      <div class="kpi brand"><div class="l">Ventas ${lbl}</div><div class="v">${money(tot)}</div><div class="s">${ven.length} pedidos</div></div>
      <div class="kpi ${util>=0?'ok':'bad'}"><div class="l">Utilidad ${lbl}</div><div class="v">${money(util)}</div><div class="s">Gastos ${money(tg)}</div></div>
      <div class="kpi"><div class="l">Bolsas 1.5 kg</div><div class="v">${int(b15)}</div><div class="s">vendidas</div></div>
      <div class="kpi"><div class="l">Bolsas 3 kg</div><div class="v">${int(b3)}</div><div class="s">vendidas</div></div>
      <div class="kpi"><div class="l">Stock 1.5 kg</div><div class="v" style="color:${st.s15<S.empresa.stock_minimo_15?'var(--bad)':'inherit'}">${int(st.s15)}</div><div class="s">bolsas</div></div>
      <div class="kpi"><div class="l">Stock 3 kg</div><div class="v" style="color:${st.s3<S.empresa.stock_minimo_3?'var(--bad)':'inherit'}">${int(st.s3)}</div><div class="s">bolsas</div></div>
      <div class="kpi" data-go="cobrar" style="cursor:pointer"><div class="l">Por cobrar</div><div class="v" style="color:var(--warn)">${money(porCobrar)}</div><div class="s">clientes deben</div></div>
      <div class="kpi" data-go="pagar" style="cursor:pointer"><div class="l">Por pagar (mes)</div><div class="v" style="color:var(--bad)">${money(S.cuentas.filter(c=>!c.pagado&&mesDe(c.vencimiento)<=mesDe(h)).reduce((a,c)=>a+num(c.monto),0))}</div><div class="s">pendiente</div></div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Bolsas vendidas · últimos 14 días</h3><div class="chartbox"><canvas id="chVentas"></canvas></div></div>
    <div class="card"><h3>🏆 Clientes que más compran · ${lbl}</h3>
      ${topCli.length?topCli.map(([id,o],i)=>{const c=cliById(+id);return `<div style="margin-bottom:10px"><div class="row"><b>${i+1}.</b><div class="grow t">${esc(c?.nombre||'—')}</div><div class="amt">${money(o.t)}</div></div><div class="sub">${int(o.b)} bolsas · ${esc(c?.distrito||'')}</div><div class="bar"><i style="width:${o.t/maxCli*100}%"></i></div></div>`}).join(''):'<div class="empty">Aún no hay ventas en este período</div>'}
    </div>
    <div class="card"><h3>📍 Distritos que más compran · ${lbl}</h3>
      ${topDis.length?topDis.map(([d,t])=>`<div style="margin-bottom:10px"><div class="row"><div class="grow t">${esc(d)}</div><div class="amt">${money(t)}</div></div><div class="bar"><i style="width:${t/maxDis*100}%;background:#13a3a0"></i></div></div>`).join(''):'<div class="empty">Sin datos</div>'}
    </div>
    <div class="card"><h3>📅 Ventas por día de la semana (últimos 60 días)</h3>
      <div class="chartbox" style="height:180px"><canvas id="chDias"></canvas></div>
      ${byDia.some(x=>x)?`<div class="sub" style="margin-top:8px">💡 El día que más se vende es <b>${DIAS[mejorDia]}</b>: produce más hielo el día anterior.</div>`:''}
    </div>`;

  $$('.seg button',el).forEach(b=>b.onclick=()=>{S.periodo=b.dataset.p; render();});
  $$('[data-go]',el).forEach(a=>a.onclick=()=>{
    const g=a.dataset.go;
    if(g==='pagar'){S.finTab='pagar'; go('finanzas');}
    else if(g==='recordar'){S.cliFiltro='recordar'; go('clientes');}
    else if(g==='cobrar'){S.cliFiltro='deuda'; go('clientes');}
    else go(g);
  });

  // charts
  const dias = [...Array(14)].map((_,i)=>addDays(h,i-13));
  const d15 = dias.map(d=>S.ventas.filter(v=>v.fecha===d).reduce((a,v)=>a+v.cant_15,0));
  const d3 = dias.map(d=>S.ventas.filter(v=>v.fecha===d).reduce((a,v)=>a+v.cant_3,0));
  charts.push(new Chart($('#chVentas'),{type:'bar',data:{labels:dias.map(d=>fmtFecha(d)),datasets:[{label:'1.5 kg',data:d15,backgroundColor:'#1688c9',borderRadius:4},{label:'3 kg',data:d3,backgroundColor:'#0b3d5c',borderRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true}}}}));
  const ord = [1,2,3,4,5,6,0];
  charts.push(new Chart($('#chDias'),{type:'bar',data:{labels:ord.map(i=>DIAS[i].slice(0,3)),datasets:[{label:'Bolsas',data:ord.map(i=>byDia[i]),backgroundColor:ord.map(i=>i===mejorDia?'#13a3a0':'#9fd3ee'),borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}}));
}

/* ================= VENDER ================= */
function vVender(el){
  const E = S.empresa;
  const st = { cli:null, c15:0, c3:0, p15:num(E.precio_15), p3:num(E.precio_3), pago:'Pagado', metodo:'Efectivo', canal:'WhatsApp', entrega:'Delivery' };
  el.innerHTML = `
    <div class="card">
      <h3>Nueva venta</h3>
      <label>Cliente (nombre o celular)</label>
      <div id="cliBox"><input id="cliQ" placeholder="Buscar o escribir número…" autocomplete="off"><div id="sugg"></div></div>
      <div style="height:10px"></div>
      <div class="prod"><div class="ic">1.5kg</div><div class="grow"><b>Bolsa 1.5 kg</b><div class="sub">S/ <input id="p15" type="number" step="0.1" style="width:80px;padding:4px 6px;font-size:14px" value="${st.p15}"> c/u</div></div>
        <div class="step"><button data-s="15" data-d="-1">−</button><input id="c15" type="number" inputmode="numeric" value="0"><button data-s="15" data-d="1">+</button></div></div>
      <div class="quick" style="margin:-4px 0 10px">${[5,10,20,50,100].map(n=>`<button data-q="15" data-n="${n}">+${n}</button>`).join('')}</div>
      <div class="prod"><div class="ic">3kg</div><div class="grow"><b>Bolsa 3 kg</b><div class="sub">S/ <input id="p3" type="number" step="0.1" style="width:80px;padding:4px 6px;font-size:14px" value="${st.p3}"> c/u</div></div>
        <div class="step"><button data-s="3" data-d="-1">−</button><input id="c3" type="number" inputmode="numeric" value="0"><button data-s="3" data-d="1">+</button></div></div>
      <div class="quick" style="margin:-4px 0 10px">${[5,10,20,50,100].map(n=>`<button data-q="3" data-n="${n}">+${n}</button>`).join('')}</div>
      <div class="total"><span>Total</span><b id="tot">S/ 0.00</b></div>
      <label>Estado de pago</label><div class="chips" data-k="pago">${['Pagado','Pendiente','Parcial'].map(x=>`<button class="${x===st.pago?'on':''}">${x}</button>`).join('')}</div>
      <div id="parcialBox" class="hidden"><label>Monto pagado ahora</label><input id="pagado" type="number" step="0.1" inputmode="decimal"></div>
      <label>Método</label><div class="chips" data-k="metodo">${['Efectivo','Yape','Plin','Transferencia'].map(x=>`<button class="${x===st.metodo?'on':''}">${x}</button>`).join('')}</div>
      <label>Pedido por</label><div class="chips" data-k="canal">${['WhatsApp','Llamada','En local'].map(x=>`<button class="${x===st.canal?'on':''}">${x}</button>`).join('')}</div>
      <label>Entrega</label><div class="chips" data-k="entrega">${['Delivery','Recojo'].map(x=>`<button class="${x===st.entrega?'on':''}">${x}</button>`).join('')}</div>
      <div class="grid2"><div><label>Fecha</label><input id="fecha" type="date" value="${hoy()}"></div><div><label>Distrito</label><select id="dist"><option value="">—</option>${DISTRITOS.map(d=>`<option>${d}</option>`).join('')}</select></div></div>
      <label>Nota</label><input id="nota" placeholder="Ej. entregar 3pm">
      <div style="height:14px"></div>
      <button class="btn block" id="guardar">💾 Registrar venta</button>
    </div>
    <div class="sectiontitle"><h2>Últimas ventas</h2><span class="sub">toca para ver</span></div>
    <div class="card list" id="ultimas"></div>`;

  const upd = () => {
    st.c15 = Math.max(0, parseInt($('#c15').value)||0); st.c3 = Math.max(0, parseInt($('#c3').value)||0);
    st.p15 = num($('#p15').value); st.p3 = num($('#p3').value);
    $('#tot').textContent = money(st.c15*st.p15 + st.c3*st.p3);
  };
  $$('.step button',el).forEach(b=>b.onclick=()=>{ const i=$('#c'+b.dataset.s); i.value=Math.max(0,(parseInt(i.value)||0)+ +b.dataset.d); upd(); });
  $$('.quick button',el).forEach(b=>b.onclick=()=>{ const i=$('#c'+b.dataset.q); i.value=(parseInt(i.value)||0)+ +b.dataset.n; upd(); });
  ['#c15','#c3','#p15','#p3'].forEach(s=>$(s).oninput=upd);
  $$('.chips',el).forEach(g=>$$('button',g).forEach(b=>b.onclick=()=>{ $$('button',g).forEach(x=>x.classList.remove('on')); b.classList.add('on'); st[g.dataset.k]=b.textContent; if(g.dataset.k==='pago') $('#parcialBox').classList.toggle('hidden', st.pago!=='Parcial'); }));

  // cliente picker
  const pick = c => {
    st.cli = c;
    $('#cliBox').innerHTML = `<div class="picked"><div class="av">${esc(iniciales(c.nombre))}</div><div class="grow"><div class="t">${esc(c.nombre)}</div><div class="sub">${esc(c.telefono||'')} · ${esc(c.distrito||'sin distrito')}${c.ultima_compra?' · última: '+fmtFecha(c.ultima_compra):''}</div></div><button class="btn sm ghost" id="unpick">Cambiar</button></div>`;
    $('#unpick').onclick = () => { st.cli=null; vVenderPicker(); };
    if(c.precio_15!=null) $('#p15').value=c.precio_15; else $('#p15').value=E.precio_15;
    if(c.precio_3!=null) $('#p3').value=c.precio_3; else $('#p3').value=E.precio_3;
    if(c.distrito) $('#dist').value = DISTRITOS.includes(c.distrito)?c.distrito:'Otro';
    upd();
  };
  const vVenderPicker = () => {
    $('#cliBox').innerHTML = `<input id="cliQ" placeholder="Buscar o escribir número…" autocomplete="off"><div id="sugg"></div>`;
    bindQ();
  };
  const bindQ = () => {
    const q = $('#cliQ'), sg = $('#sugg');
    q.oninput = () => {
      const t = q.value.trim().toLowerCase(), digits = t.replace(/\D/g,'');
      if(!t){ sg.innerHTML=''; sg.className=''; return; }
      const res = S.clientes.filter(c => c.nombre.toLowerCase().includes(t) || (digits.length>=3 && (c.telefono||'').replace(/\D/g,'').includes(digits))).slice(0,8);
      sg.className='sugg';
      sg.innerHTML = res.map(c=>`<div data-id="${c.id}"><b>${esc(c.nombre)}</b> <span class="sub">${esc(c.telefono||'')} · ${esc(c.distrito||'')}</span></div>`).join('')
        + `<div data-new="1" style="color:var(--brand2);font-weight:700">＋ Nuevo cliente “${esc(q.value.trim())}”</div>`;
      $$('[data-id]',sg).forEach(d=>d.onclick=()=>pick(cliById(+d.dataset.id)));
      $('[data-new]',sg).onclick = () => {
        const v = q.value.trim(), isTel = /^[\d\s+]{6,}$/.test(v);
        formCliente(isTel?{telefono:v}:{nombre:v}, async c => { await loadAll(); pick(S.clientes.find(x=>x.id===c.id)); });
      };
    };
  };
  bindQ();

  $('#guardar').onclick = async () => {
    upd();
    if(!st.c15 && !st.c3) return toast('Agrega al menos una bolsa');
    const total = st.c15*st.p15 + st.c3*st.p3;
    let pagado = st.pago==='Pagado' ? total : st.pago==='Pendiente' ? 0 : num($('#pagado').value);
    const row = { fecha:$('#fecha').value||hoy(), cliente_id:st.cli?.id||null, cant_15:st.c15, cant_3:st.c3, precio_15:st.p15, precio_3:st.p3, monto_pagado:Math.min(pagado,total), metodo_pago:st.metodo, canal:st.canal, entrega:st.entrega, distrito:$('#dist').value||st.cli?.distrito||null, notas:$('#nota').value||null };
    $('#guardar').disabled = true;
    try{ const {error} = await sb.from('hielo_ventas').insert(row); chk(error); toast('✅ Venta registrada'); await loadAll(); render(); }
    finally{ const b=$('#guardar'); if(b) b.disabled=false; }
  };

  // últimas ventas
  const ult = S.ventas.slice(0,25);
  $('#ultimas').innerHTML = ult.length ? ult.map(itemVenta).join('') : '<div class="empty">Todavía no hay ventas. ¡Registra la primera! 🧊</div>';
  $$('#ultimas [data-venta]').forEach(i=>i.onclick=()=>detalleVenta(+i.dataset.venta));
}
function itemVenta(v){
  const c = cliById(v.cliente_id), d = deuda(v);
  return `<div class="item" data-venta="${v.id}"><div class="av">${esc(iniciales(c?.nombre||'Varios'))}</div><div class="grow"><div class="t">${esc(c?.nombre||'Cliente varios')}</div><div class="sub">${fmtFecha(v.fecha)} · ${v.cant_15?v.cant_15+'×1.5kg ':''}${v.cant_3?v.cant_3+'×3kg':''} · ${esc(v.canal||'')}</div></div><div><div class="amt">${money(v.total)}</div><div class="r">${d>0?`<span class="badge warn">debe ${money(d)}</span>`:`<span class="badge ok">${esc(v.metodo_pago||'pagado')}</span>`}</div></div></div>`;
}
function detalleVenta(id){
  const v = S.ventas.find(x=>x.id===id), c = cliById(v.cliente_id), d = deuda(v);
  sheet('Venta #'+v.id, `
    <div class="kv"><span>Cliente</span><span>${esc(c?.nombre||'Cliente varios')}</span></div>
    <div class="kv"><span>Fecha</span><span>${fmtFechaL(v.fecha)}</span></div>
    <div class="kv"><span>Bolsas 1.5 kg</span><span>${v.cant_15} × ${money(v.precio_15)}</span></div>
    <div class="kv"><span>Bolsas 3 kg</span><span>${v.cant_3} × ${money(v.precio_3)}</span></div>
    <div class="kv"><span>Total</span><b>${money(v.total)}</b></div>
    <div class="kv"><span>Pagado</span><span>${money(v.monto_pagado)} (${esc(v.metodo_pago||'')})</span></div>
    <div class="kv"><span>Pedido / entrega</span><span>${esc(v.canal||'')} · ${esc(v.entrega||'')}</span></div>
    <div class="kv"><span>Distrito</span><span>${esc(v.distrito||'—')}</span></div>
    ${v.notas?`<div class="kv"><span>Nota</span><span>${esc(v.notas)}</span></div>`:''}
    <div style="height:14px"></div>
    <div class="grid2">
      ${d>0?`<button class="btn" id="cobrar">💵 Cobrar ${money(d)}</button>`:''}
      ${c?.telefono?`<a class="btn wa" href="https://wa.me/${telWa(c.telefono)}" target="_blank">WhatsApp</a>`:''}
      <button class="btn danger" id="borrar">🗑 Eliminar</button>
    </div>`, (sh, close) => {
      const cb = $('#cobrar',sh);
      if(cb) cb.onclick = async () => { const {error}=await sb.from('hielo_ventas').update({monto_pagado:v.total}).eq('id',v.id); chk(error); toast('Cobrado ✅'); close(); await loadAll(); render(); };
      $('#borrar',sh).onclick = async () => { if(!confirmar('¿Eliminar esta venta? El stock se repondrá.')) return; const {error}=await sb.from('hielo_ventas').delete().eq('id',v.id); chk(error); toast('Venta eliminada'); close(); await loadAll(); render(); };
    });
}

/* ================= CLIENTES ================= */
function formCliente(c={}, onSaved){
  const E = S.empresa;
  sheet(c.id?'Editar cliente':'Nuevo cliente', `
    <form id="fc">
      <label>Nombre / negocio *</label><input name="nombre" required value="${esc(c.nombre||'')}" placeholder="Ej. Bodega Doña Rosa">
      <label>Celular (WhatsApp)</label><input name="telefono" inputmode="tel" value="${esc(c.telefono||'')}" placeholder="9XXXXXXXX">
      <div class="grid2">
        <div><label>Distrito</label><select name="distrito"><option value="">—</option>${DISTRITOS.map(d=>`<option ${d===c.distrito?'selected':''}>${d}</option>`).join('')}</select></div>
        <div><label>Tipo</label><select name="tipo">${TIPOS_CLI.map(d=>`<option ${d===(c.tipo||'Bodega')?'selected':''}>${d}</option>`).join('')}</select></div>
      </div>
      <label>Dirección</label><input name="direccion" value="${esc(c.direccion||'')}">
      <label>Referencia</label><input name="referencia" value="${esc(c.referencia||'')}" placeholder="Frente al parque…">
      <label>Recordarle cada (días)</label><input name="frecuencia_dias" type="number" min="1" value="${c.frecuencia_dias||7}">
      <div class="grid2">
        <div><label>Precio especial 1.5kg</label><input name="precio_15" type="number" step="0.1" value="${c.precio_15??''}" placeholder="${E.precio_15}"></div>
        <div><label>Precio especial 3kg</label><input name="precio_3" type="number" step="0.1" value="${c.precio_3??''}" placeholder="${E.precio_3}"></div>
      </div>
      <label>Notas</label><textarea name="notas" rows="2">${esc(c.notas||'')}</textarea>
      ${c.id?`<label><input type="checkbox" name="activo" ${c.activo?'checked':''} style="width:auto"> Cliente activo</label>`:''}
      <div style="height:14px"></div>
      <button class="btn block">Guardar</button>
    </form>`, (sh, close) => {
      $('#fc',sh).onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const row = { nombre:f.get('nombre').trim(), telefono:f.get('telefono').trim()||null, distrito:f.get('distrito')||null, tipo:f.get('tipo'), direccion:f.get('direccion')||null, referencia:f.get('referencia')||null, frecuencia_dias:parseInt(f.get('frecuencia_dias'))||7, precio_15:f.get('precio_15')===''?null:num(f.get('precio_15')), precio_3:f.get('precio_3')===''?null:num(f.get('precio_3')), notas:f.get('notas')||null };
        if(c.id) row.activo = f.get('activo')==='on';
        if(row.telefono && !c.id){ const dup = S.clientes.find(x=>(x.telefono||'').replace(/\D/g,'')===row.telefono.replace(/\D/g,'')); if(dup && !confirmar(`Ya existe "${dup.nombre}" con ese número. ¿Crear de todas formas?`)) return; }
        const q = c.id ? sb.from('hielo_clientes').update(row).eq('id',c.id).select().single() : sb.from('hielo_clientes').insert(row).select().single();
        const {data,error} = await q; chk(error);
        toast('Cliente guardado'); close();
        if(onSaved) onSaved(data); else { await loadAll(); render(); }
      };
    });
}
function mensajeWa(c){
  return (S.empresa.mensaje_recordatorio||'').replaceAll('{nombre}', c.nombre||'').replaceAll('{dias}', c.dias_sin_comprar ?? '');
}
async function enviarRecordatorio(c){
  window.open(`https://wa.me/${telWa(c.telefono)}?text=${encodeURIComponent(mensajeWa(c))}`,'_blank');
  await sb.from('hielo_clientes').update({ultimo_recordatorio:hoy()}).eq('id',c.id);
  c.ultimo_recordatorio = hoy();
}
function vClientes(el){
  const rec = porRecordar();
  el.innerHTML = `
    <input class="search" id="q" placeholder="🔎 Buscar por nombre, número o distrito">
    <div class="seg">${[['todos','Todos'],['recordar',`Recordar (${rec.length})`],['deuda','Deben'],['top','Top'],['inactivos','Sin comprar']].map(([k,l])=>`<button data-f="${k}" class="${S.cliFiltro===k?'on':''}">${l}</button>`).join('')}</div>
    ${S.cliFiltro==='recordar'&&rec.length?`<button class="btn wa block" id="recAll" style="margin-bottom:12px">💬 Enviar al siguiente (${rec.length} pendientes)</button>`:''}
    <div class="card list" id="lst"></div>`;
  const draw = () => {
    const t = $('#q').value.trim().toLowerCase();
    let L = S.cliFiltro==='recordar' ? rec : S.clientes.slice();
    if(S.cliFiltro==='deuda') L = L.filter(c=>num(c.deuda)>0).sort((a,b)=>b.deuda-a.deuda);
    if(S.cliFiltro==='top') L = L.filter(c=>c.n_compras>0).sort((a,b)=>b.total_comprado-a.total_comprado);
    if(S.cliFiltro==='inactivos') L = L.filter(c=>!c.ultima_compra || c.dias_sin_comprar>30).sort((a,b)=>(b.dias_sin_comprar??9999)-(a.dias_sin_comprar??9999));
    if(t) L = L.filter(c=>[c.nombre,c.telefono,c.distrito,c.direccion].join(' ').toLowerCase().includes(t));
    $('#lst').innerHTML = L.length ? L.map(c=>{
      const dias = c.dias_sin_comprar;

function selMes(){ return `<input type="month" id="mes" value="${S.mes}" style="margin-bottom:12px">`; }
function bindMes(el){ $('#mes',el).onchange = e => { S.mes = e.target.value || hoy().slice(0,7); render(); }; }

function finResumen(el){
  const m = S.mes;
  const ven = S.ventas.filter(v=>mesDe(v.fecha)===m), gas = S.gastos.filter(g=>mesDe(g.fecha)===m);
  const ventas = ven.reduce((a,v)=>a+num(v.total),0), cobrado = ven.reduce((a,v)=>a+num(v.monto_pagado),0);
  const fijos = gas.filter(g=>g.tipo==='Fijo').reduce((a,g)=>a+num(g.monto),0);
  const variables = gas.filter(g=>g.tipo==='Variable').reduce((a,g)=>a+num(g.monto),0);
  const prest = gas.filter(g=>g.tipo==='Préstamo').reduce((a,g)=>a+num(g.monto),0);
  const util = ventas - fijos - variables, margen = ventas ? util/ventas*100 : 0;
  const flujo = cobrado - fijos - variables - prest;
  const pend = S.cuentas.filter(c=>!c.pagado && mesDe(c.vencimiento)===m).reduce((a,c)=>a+num(c.monto),0);
  const bolsas = ven.reduce((a,v)=>a+v.cant_15+v.cant_3,0);
  const cats = {}; gas.forEach(g=>cats[g.categoria]=(cats[g.categoria]||0)+num(g.monto));
  // punto de equilibrio aprox: gastos / precio promedio por bolsa
  const ppb = bolsas ? ventas/bolsas : (num(S.empresa.precio_15)+num(S.empresa.precio_3))/2;
  const equilibrio = ppb ? Math.ceil((fijos+variables+pend)/ppb) : 0;

  el.innerHTML = `${selMes()}
    <div class="card"><h3>Estado de resultados · ${nombreMes(m)}</h3>
      <div class="kv"><span>Ventas (${int(bolsas)} bolsas)</span><b style="color:var(--ok)">${money(ventas)}</b></div>
      <div class="kv"><span>(−) Gastos fijos</span><span>${money(fijos)}</span></div>
      <div class="kv"><span>(−) Gastos variables</span><span>${money(variables)}</span></div>
      <div class="kv"><span><b>Utilidad</b> · margen ${margen.toFixed(0)}%</span><b style="color:${util>=0?'var(--ok)':'var(--bad)'};font-size:18px">${money(util)}</b></div>
    </div>
    <div class="card"><h3>Caja del mes</h3>
      <div class="kv"><span>Cobrado a clientes</span><span>${money(cobrado)}</span></div>
      <div class="kv"><span>Pagado (gastos + cuotas préstamos)</span><span>${money(fijos+variables+prest)}</span></div>
      <div class="kv"><span><b>Flujo neto</b></span><b style="color:${flujo>=0?'var(--ok)':'var(--bad)'}">${money(flujo)}</b></div>
      <div class="kv"><span>Aún por pagar este mes</span><span style="color:var(--bad)">${money(pend)}</span></div>
      <div class="kv"><span>Por cobrar de este mes</span><span style="color:var(--warn)">${money(ventas-cobrado)}</span></div>
    </div>
    <div class="alert info" style="cursor:default">🎯 <div>Para cubrir todos los gastos del mes necesitas vender aprox. <b>${int(equilibrio)} bolsas</b> (llevas ${int(bolsas)}).</div></div>
    <div class="card"><h3>Ventas vs gastos · últimos 6 meses</h3><div class="chartbox"><canvas id="chMes"></canvas></div></div>
    <div class="card"><h3>Gastos por categoría</h3>${Object.keys(cats).length?'<div class="chartbox"><canvas id="chCat"></canvas></div>':'<div class="empty">Sin gastos este mes</div>'}</div>`;
  bindMes(el);
  const meses = [...Array(6)].map((_,i)=>{ const d=new Date(m+'-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth()-5+i); return d.toISOString().slice(0,7); });
  charts.push(new Chart($('#chMes'),{type:'bar',data:{labels:meses.map(x=>nombreMes(x).slice(0,3)),datasets:[
    {label:'Ventas',data:meses.map(x=>S.ventas.filter(v=>mesDe(v.fecha)===x).reduce((a,v)=>a+num(v.total),0)),backgroundColor:'#13875b',borderRadius:4},
    {label:'Gastos',data:meses.map(x=>S.gastos.filter(g=>mesDe(g.fecha)===x&&g.tipo!=='Préstamo').reduce((a,g)=>a+num(g.monto),0)),backgroundColor:'#e07a5f',borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}}));
  if(Object.keys(cats).length) charts.push(new Chart($('#chCat'),{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#1688c9','#0b3d5c','#13a3a0','#f2a541','#e07a5f','#8d6cc4','#5fa8d3','#b5c99a','#c2312f','#7d8b99','#ffcb77']}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right'}}}}));
}

    ${S.prestamos.length?S.prestamos.map(p=>{const i=info(p); const pct=i.total?i.pagado/i.total*100:0; return `<div class="card"><div class="row"><div class="av">🏦</div><div class="grow"><div class="t">${esc(p.acreedor)}</div><div class="sub">Recibido ${money(p.monto)} el ${fmtFecha(p.fecha)} · ${i.np}/${i.n} cuotas</div></div><button class="btn sm danger" data-dp="${p.id}">🗑</button></div>
      <div class="bar" style="height:10px;margin-top:12px"><i style="width:${pct}%;background:var(--ok)"></i></div>
      <div class="row" style="margin-top:6px;font-size:13px"><span class="grow muted">Pagado ${money(i.pagado)}</span><b>Falta ${money(i.total-i.pagado)}</b></div>
      ${i.prox?`<div class="sub" style="margin-top:6px">Próxima cuota: ${money(i.prox.monto)} · ${fmtFechaL(i.prox.vencimiento)}</div>`:'<div class="sub" style="margin-top:6px;color:var(--ok)">✅ Préstamo cancelado</div>'}
      ${p.notas?`<div class="sub">${esc(p.notas)}</div>`:''}</div>`;}).join(''):'<div class="card empty">No hay préstamos registrados.<br>Para pagos sueltos como “Devolución”, usa <b>Por pagar</b>.</div>'}`;
  $$('[data-dp]',el).forEach(b=>b.onclick=async()=>{ if(!confirmar('¿Eliminar préstamo y sus cuotas pendientes?')) return; const {error}=await sb.from('hielo_prestamos').delete().eq('id',+b.dataset.dp); chk(error); await loadAll(); render(); });
  const fab=document.createElement('button'); fab.className='fab'; fab.textContent='＋'; fab.onclick=formPrestamo; document.body.appendChild(fab);
}

/* ================= STOCK ================= */
function vStock(el){
  const st = stockActual(), h = hoy();
  const movH = S.movs.filter(m=>m.fecha===h && m.tipo==='Producción');
  const venH = S.ventas.filter(v=>v.fecha===h);
  const p15 = movH.reduce((a,m)=>a+m.cant_15,0), p3 = movH.reduce((a,m)=>a+m.cant_3,0);
  const v15 = venH.reduce((a,v)=>a+v.cant_15,0), v3 = venH.reduce((a,v)=>a+v.cant_3,0);
  // promedio diario últimos 14 días para sugerir producción
  const ini = addDays(h,-13), ult = S.ventas.filter(v=>v.fecha>=ini);
  const prom15 = Math.ceil(ult.reduce((a,v)=>a+v.cant_15,0)/14), prom3 = Math.ceil(ult.reduce((a,v)=>a+v.cant_3,0)/14);
  const st7 = {tipo:'Producción'};
  el.innerHTML = `
    <div class="grid2">
      <div class="kpi brand"><div class="l">Stock 1.5 kg</div><div class="v">${int(st.s15)}</div><div class="s">mín. ${S.empresa.stock_minimo_15}</div></div>
      <div class="kpi brand"><div class="l">Stock 3 kg</div><div class="v">${int(st.s3)}</div><div class="s">mín. ${S.empresa.stock_minimo_3}</div></div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Hoy</h3>
      <div class="kv"><span>Producido</span><span>${int(p15)} × 1.5kg · ${int(p3)} × 3kg</span></div>
      <div class="kv"><span>Vendido</span><span>${int(v15)} × 1.5kg · ${int(v3)} × 3kg</span></div>
      <div class="kv"><span>Promedio diario de venta (14 d)</span><span>${int(prom15)} · ${int(prom3)}</span></div>
    </div>
    <div class="card"><h3>Registrar movimiento</h3>
      <div class="chips" id="tipoMov">${['Producción','Merma','Ajuste'].map(x=>`<button class="${x===st7.tipo?'on':''}">${x}</button>`).join('')}</div>
      <div class="sub" id="tipoHelp" style="margin-top:6px">Bolsas que salieron de la máquina / congeladora listas para vender.</div>
      <div class="grid2"><div><label>Bolsas 1.5 kg</label><input id="m15" type="number" inputmode="numeric" value="0"></div><div><label>Bolsas 3 kg</label><input id="m3" type="number" inputmode="numeric" value="0"></div></div>
      <div class="grid2"><div><label>Fecha</label><input id="mf" type="date" value="${h}"></div><div><label>Nota</label><input id="mn" placeholder="opcional"></div></div>
      <div style="height:12px"></div><button class="btn block" id="mGuardar">Guardar</button>
    </div>
    <div class="sectiontitle"><h2>Movimientos</h2><span class="sub">toca para eliminar</span></div>
    <div class="card list">${S.movs.slice(0,40).map(m=>`<div class="item" data-m="${m.id}"><div class="av">${m.tipo==='Producción'?'🏭':m.tipo==='Merma'?'💧':'⚖️'}</div><div class="grow"><div class="t">${m.tipo}</div><div class="sub">${fmtFecha(m.fecha)} ${m.notas?'· '+esc(m.notas):''}</div></div><div class="amt">${m.tipo==='Merma'?'−':''}${m.cant_15} · ${m.cant_3}</div></div>`).join('')||'<div class="empty">Registra tu primera producción del día 🏭</div>'}</div>`;
  const help = {'Producción':'Bolsas que salieron de la máquina / congeladora listas para vender.','Merma':'Bolsas que se derritieron, rompieron o se regalaron (se restan).','Ajuste':'Corrección después de contar físicamente (usa negativo para restar).'};
  $$('#tipoMov button').forEach(b=>b.onclick=()=>{ $$('#tipoMov button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); st7.tipo=b.textContent; $('#tipoHelp').textContent=help[st7.tipo]; });
  $('#mGuardar').onclick = async () => {
    const r = {tipo:st7.tipo, cant_15:parseInt($('#m15').value)||0, cant_3:parseInt($('#m3').value)||0, fecha:$('#mf').value||h, notas:$('#mn').value||null};
    if(!r.cant_15 && !r.cant_3) return toast('Ingresa una cantidad');
    if(r.tipo!=='Ajuste'){ r.cant_15=Math.abs(r.cant_15); r.cant_3=Math.abs(r.cant_3); }
    const {error}=await sb.from('hielo_movimientos_stock').insert(r); chk(error); toast('Stock actualizado'); await loadAll(); render();
  };
  $$('[data-m]',el).forEach(i=>i.onclick=async()=>{ if(!confirmar('¿Eliminar movimiento?')) return; const {error}=await sb.from('hielo_movimientos_stock').delete().eq('id',+i.dataset.m); chk(error); await loadAll(); render(); });
}

/* ================= CONFIG ================= */
function csv(nombre, rows){
  if(!rows.length) return toast('No hay datos');
  const cols = Object.keys(rows[0]);
  const txt = '﻿' + [cols.join(';'), ...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv'})); a.download = nombre+'_'+hoy()+'.csv'; a.click();
}
function vConfig(el){
  const E = S.empresa;
  el.innerHTML = `
    <div class="card"><h3>Empresa</h3>
      <form id="fe">
        <label>Razón social</label><input name="nombre" value="${esc(E.nombre)}">
        <div class="grid2"><div><label>RUC</label><input name="ruc" value="${esc(E.ruc||'')}"></div><div><label>Teléfono</label><input name="telefono" value="${esc(E.telefono||'')}"></div></div>
        <label>Dirección</label><input name="direccion" value="${esc(E.direccion||'')}">
        <div class="grid2"><div><label>Precio bolsa 1.5 kg</label><input name="precio_15" type="number" step="0.1" value="${E.precio_15}"></div><div><label>Precio bolsa 3 kg</label><input name="precio_3" type="number" step="0.1" value="${E.precio_3}"></div></div>
        <div class="grid2"><div><label>Stock mínimo 1.5 kg</label><input name="stock_minimo_15" type="number" value="${E.stock_minimo_15}"></div><div><label>Stock mínimo 3 kg</label><input name="stock_minimo_3" type="number" value="${E.stock_minimo_3}"></div></div>
        <label>Mensaje de recordatorio WhatsApp <span class="muted">({nombre}, {dias})</span></label><textarea name="mensaje_recordatorio" rows="4">${esc(E.mensaje_recordatorio)}</textarea>
        <div style="height:12px"></div><button class="btn block">Guardar cambios</button>
      </form>
    </div>
    <div class="card"><h3>Usuarios con acceso</h3>
      <div class="list">${S.admins.map(a=>`<div class="item" style="cursor:default"><div class="av">👤</div><div class="grow t">${esc(a.email)}</div>${S.admins.length>1?`<button class="btn sm danger" data-ad="${esc(a.email)}">Quitar</button>`:''}</div>`).join('')}</div>
      <form id="fa" class="row" style="margin-top:8px"><input name="email" type="email" placeholder="correo@ejemplo.com" required><button class="btn">Añadir</button></form>
      <div class="sub" style="margin-top:6px">La persona añadida debe crear su cuenta con ese mismo correo.</div>
    </div>
    <div class="card"><h3>Exportar a Excel (CSV)</h3>
      <div class="grid2"><button class="btn ghost" data-x="ventas">Ventas</button><button class="btn ghost" data-x="clientes">Clientes</button><button class="btn ghost" data-x="gastos">Gastos</button><button class="btn ghost" data-x="cuentas">Por pagar</button></div>
    </div>
    <button class="btn danger block" id="salir">Cerrar sesión</button>
    <div class="sub" style="text-align:center;margin-top:12px">MJ Hielería · Portal interno</div>`;
  $('#fe').onsubmit = async e => { e.preventDefault(); const f=Object.fromEntries(new FormData(e.target)); ['precio_15','precio_3'].forEach(k=>f[k]=num(f[k])); ['stock_minimo_15','stock_minimo_3'].forEach(k=>f[k]=parseInt(f[k])||0); f.updated_at=new Date().toISOString(); const {error}=await sb.from('hielo_empresa').update(f).eq('id',1); chk(error); toast('Guardado'); await loadAll(); render(); };
  $('#fa').onsubmit = async e => { e.preventDefault(); const email=new FormData(e.target).get('email').trim().toLowerCase(); const {error}=await sb.from('hielo_admins').insert({email}); chk(error); toast('Acceso añadido'); await loadAll(); render(); };
  $$('[data-ad]').forEach(b=>b.onclick=async()=>{ if(!confirmar('¿Quitar acceso a '+b.dataset.ad+'?')) return; const {error}=await sb.from('hielo_admins').delete().eq('email',b.dataset.ad); chk(error); await loadAll(); render(); });
  $$('[data-x]').forEach(b=>b.onclick=()=>{ const k=b.dataset.x;
    if(k==='ventas') csv('ventas', S.ventas.map(v=>({fecha:v.fecha, cliente:cliById(v.cliente_id)?.nombre||'', telefono:cliById(v.cliente_id)?.telefono||'', bolsas_1_5kg:v.cant_15, bolsas_3kg:v.cant_3, total:v.total, pagado:v.monto_pagado, metodo:v.metodo_pago, canal:v.canal, entrega:v.entrega, distrito:v.distrito, notas:v.notas})));
    if(k==='clientes') csv('clientes', S.clientes.map(c=>({nombre:c.nombre, telefono:c.telefono, distrito:c.distrito, direccion:c.direccion, tipo:c.tipo, ultima_compra:c.ultima_compra, compras:c.n_compras, total:c.total_comprado, deuda:c.deuda})));
    if(k==='gastos') csv('gastos', S.gastos.map(g=>({fecha:g.fecha, categoria:g.categoria, tipo:g.tipo, descripcion:g.descripcion, monto:g.monto})));
    if(k==='cuentas') csv('por_pagar', S.cuentas.map(c=>({concepto:c.concepto, detalle:c.detalle, monto:c.monto, vence:c.vencimiento, tipo:c.tipo, pagado:c.pagado?'Sí':'No', fecha_pago:c.fecha_pago})));
  });
  $('#salir').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

/* ================= AUTH & BOOT ================= */
let signup = false;
$('#toggleSignup').onclick = () => { signup=!signup; $('#loginBtn').textContent = signup?'Crear cuenta':'Ingresar'; $('#toggleSignup').textContent = signup?'Ya tengo cuenta · Ingresar':'¿Primera vez? Crear cuenta'; $('#loginErr').textContent=''; };
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); $('#loginErr').textContent=''; $('#loginBtn').disabled=true;
  try{
    if(signup){
      const {data,error} = await sb.auth.signUp({email:f.email, password:f.password});
      if(error) throw error;
      if(!data.session){ $('#loginErr').style.color='var(--ok)'; $('#loginErr').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego ingresa.'; return; }
    } else {
      const {error} = await sb.auth.signInWithPassword({email:f.email, password:f.password}); if(error) throw error;
    }
    await boot();
  }catch(err){ $('#loginErr').style.color='var(--bad)'; $('#loginErr').textContent = err.message==='Invalid login credentials'?'Correo o contraseña incorrectos':err.message; }
  finally{ $('#loginBtn').disabled=false; }
};
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }
  const {data:ok, error} = await sb.rpc('hielo_reclamar_portal');
  if(error || !ok){
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    $('#loginErr').style.color='var(--bad)'; $('#loginErr').textContent = `El correo ${session.user.email} no tiene acceso. Pide al dueño que lo añada en Configuración.`;
    await sb.auth.signOut(); return;
  }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#hdrSub').textContent = session.user.email;
  await loadAll(); go('inicio');
}
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#btnConfig').onclick = () => { $$('#nav button').forEach(b=>b.classList.remove('on')); S.view='config'; render(); };
$('#btnRefresh').onclick = async () => { await loadAll(); render(); toast('Actualizado'); };
boot();
</script>
